  <section id="chart-wrap-wrap">
    <input type="checkbox" id="toggle-graph" checked>
    <label for="toggle-graph">График DPS</label>
    <select id="sliced-sec" class="controls">
      <option value=0>Среднее за бой</option>
      <option value=1>По 1 секунде</option>
      <option value=2>По 2 сек.</option>
      <option value=3>По 3 сек.</option>
      <option value=5 selected>По 5 секунд</option>
      <option value=10>По 10 сек.</option>
      <option value=15>По 15 сек.</option>
      <option value=20>По 20 сек.</option>
      <option value=30>По 30 сек.</option>
    </select>
    <div class="controls range-values">
      <span class="min-value"></span>
      <span> - </span>
      <span class="max-value"></span>
      <span class="total-value"></span>
    </div>
    <button class="controls min-max-slider-submit" type="submit">Выделить период</button>
    <section id="chart-wrap">
      <canvas id="overlay" width="600" height="400" style="position:absolute;pointer-events:none;"></canvas>
      <canvas id="chart"></canvas>
    </section>
  </section>
