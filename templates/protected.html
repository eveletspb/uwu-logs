{% extends "layout.html" %}

{% block the_main %}
<main>
  <section id="psw-form" style="padding-left: 10vw;">
      <h3>This report is private.</h3>
      {% if PASSWORD_CONFIGURED %}
      <p><label for="password-field">Password</label> <input id="password-field" type="password" maxlength="64"/></p>
      <button id="submit-button">Submit</button>
      <p id="error-field"></p>
      {% endif %}
  </section>
</main>
{% endblock the_main %}
{% block main_scripts %}
<script>
const pwField = document.getElementById("password-field");
if (pwField) {
const errorField = document.getElementById("error-field");
const submitButton = document.getElementById("submit-button");

const xhttp = new XMLHttpRequest();
xhttp.onreadystatechange = () => {
  if (xhttp.readyState != 4) return;
  if (xhttp.status == 200) {
    pwField.value = "";
    window.location.reload();
  } else if (xhttp.status == 401) {
    errorField.textContent = "Incorrect password.";
  } else if (xhttp.status == 429) {
    errorField.textContent = "Try again in a minute.";
  }
}

async function digestMessage(message) {
  const msgUint8 = new TextEncoder().encode(message);
  const hashBuffer = await window.crypto.subtle.digest('SHA-256', msgUint8);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  return hashHex;
}

submitButton.addEventListener('click', () => {
  if (!window.crypto?.subtle) {
    errorField.textContent = "Open this page over HTTPS to sign in.";
    return;
  }
  digestMessage(pwField.value).then(_hash => {
    xhttp.open("POST", "/pw_validate", true);
    xhttp.send(_hash)
  })
})
}
</script>
{% endblock main_scripts %}
