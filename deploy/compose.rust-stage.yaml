name: uwu-logs-rust-stage
services:
  web:
    build:
      context: ..
      dockerfile: deploy/rust.Dockerfile
    restart: unless-stopped
    ports:
      - "192.168.1.147:5001:5000"
    volumes:
      - staged-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://127.0.0.1:5000/local-health"]
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  staged-data:
