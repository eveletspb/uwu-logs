name: raidledger
services:
  web:
    build:
      context: ..
      dockerfile: deploy/rust.Dockerfile
    restart: unless-stopped
    ports:
      - "${RAIDLEDGER_HOST:-127.0.0.1}:${RAIDLEDGER_PORT:-5000}:5000"
    volumes:
      - state:/data
      - reports:/data/LogsDir
      - archives:/data/LogsRaw
      - uploads:/data/uploads
      - database:/data/db
      - client-logs:/Logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://127.0.0.1:5000/local-health"]
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  state:
  reports:
    external: true
    name: uwu-logs_reports
  archives:
    external: true
    name: uwu-logs_archives
  uploads:
    external: true
    name: uwu-logs_uploads
  database:
    external: true
    name: uwu-logs_db
  client-logs:
    external: true
    name: uwu-logs_client-logs
